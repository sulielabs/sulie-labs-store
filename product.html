<script src="cart.js"></script>
<script>
  const WHATSAPP_NUMBER = "966581709760";
  function waLink(text){
    return "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(text);
  }
  function toArabicDigits(n){
    const map = ["٠","١","٢","٣","٤","٥","٦","٧","٨","٩"];
    return String(n).split("").map(ch => /[0-9]/.test(ch) ? map[ch] : ch).join("");
  }

  const genericMsg = "مرحباً سولي لابز! عندي سؤال عن منتجاتكم.";
  document.getElementById("navWhatsapp").href = waLink(genericMsg);
  document.getElementById("footerWhatsapp").href = waLink(genericMsg);

  async function loadProduct(){
    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    const container = document.getElementById("productContent");

    try {
      const res = await fetch("data/products.json", { cache: "no-store" });
      const data = await res.json();
      const product = (data.items || []).find(p => p.id === id);

      if (!product){
        container.innerHTML = `<p>ما لقينا هذا المنتج. <a class="back-link" href="index.html#shop" style="display:inline">رجوع للمتجر</a></p>`;
        return;
      }

      document.title = product.name + " — Sulie Labs";

      const frames = product.images.map((src, i) =>
        `<img class="${i === 0 ? 'is-active' : ''}" src="${src}" alt="${product.name}">`
      ).join("");

      const customMsg = `مرحباً! أبغى أسأل عن تخصيص (لون/مقاس) لمنتج: ${product.name}`;

      container.innerHTML = `
        <div class="gallery" id="gallery">
          ${frames}
          ${product.images.length > 1 ? '<span class="gallery-hint">دوس لتشوفها تتحرك</span>' : ''}
        </div>
        <div class="product-info">
          <div class="eyebrow"><span class="dot"></span> SULIE LABS</div>
          <h1 class="product-title">${product.name}</h1>
          <div class="product-price">${toArabicDigits(product.price)} <span class="cur">ر.س</span></div>
          <p class="product-description">${product.description}</p>
          <div class="qty-row">
            <span class="qty-label">الكمية:</span>
            <div class="qty-stepper">
              <button type="button" id="qtyMinus" aria-label="أنقص">−</button>
              <span class="qty-val" id="qtyVal">١</span>
              <button type="button" id="qtyPlus" aria-label="زد">+</button>
            </div>
          </div>
          <button class="btn btn-primary buy-btn" id="addCartBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.6 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
            أضف للسلة
          </button>
          <p class="custom-hint">🎨 تبغى لون أو مقاس مختلف؟ <a href="${waLink(customMsg)}" target="_blank" rel="noopener">تواصل واتساب</a></p>
        </div>
      `;

      // qty stepper + add to cart
      let qty = 1;
      const qtyVal = document.getElementById("qtyVal");
      const refreshQty = () => { qtyVal.textContent = toArabicDigits(qty); };
      document.getElementById("qtyMinus").addEventListener("click", () => { if (qty > 1){ qty--; refreshQty(); } });
      document.getElementById("qtyPlus").addEventListener("click", () => { if (qty < 99){ qty++; refreshQty(); } });
      const addBtn = document.getElementById("addCartBtn");
      addBtn.addEventListener("click", () => {
        window.SulieCart.add({ id: product.id, name: product.name, price: product.price, image: product.images[0] || "", qty });
        window.SulieCart.fly(addBtn);
      });

      if (product.images.length > 1){
        const gallery = document.getElementById("gallery");
        const imgs = Array.from(gallery.querySelectorAll("img"));
        let current = 0;
        gallery.addEventListener("click", () => {
          imgs[current].classList.remove("is-active");
          current = (current + 1) % imgs.length;
          imgs[current].classList.add("is-active");
        });
      }
    } catch (err){
      container.innerHTML = `<p style="color:#E5512F">تعذر تحميل المنتج، حدّث الصفحة وحاول مرة ثانية.</p>`;
      console.error(err);
    }
  }

  loadProduct();
</script>
