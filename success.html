<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>تأكيد الطلب — Sulie Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="page-bg">

<div class="build-plate"></div>

<header>
  <div class="nav-inner">
    <a class="brand" href="index.html" style="text-decoration:none">
      <img class="brand-icon" src="images/icon.png" alt="Sulie Labs">
      <div class="brand-text">
        <span class="brand-name">Sulie Labs</span>
        <span class="brand-slogan">PRINTING YOUR IMAGINATION</span>
      </div>
    </a>
  </div>
</header>

<section class="section" style="padding-top:60px;">
  <div class="wrap">
    <div id="statusCard" class="status-card">
      <div class="status-icon pending">⏳</div>
      <div class="status-title">نتحقق من عملية الدفع...</div>
      <div class="status-desc">خذ ثانية، لا تسكّر الصفحة.</div>
    </div>
  </div>
</section>

</div>

<script>
  function toArabicDigits(n){
    const map = ["٠","١","٢","٣","٤","٥","٦","٧","٨","٩"];
    return String(n).split("").map(ch => /[0-9]/.test(ch) ? map[ch] : ch).join("");
  }

  function renderStatus({icon, cls, title, desc, meta, showRetry}){
    const card = document.getElementById("statusCard");
    const wa = arguments[0].wa || "";
    let metaHtml = "";
    if (meta && meta.length){
      metaHtml = `<div class="status-meta">${meta.map(([k,v]) => `<div><span>${k}</span><span>${v}</span></div>`).join("")}</div>`;
    }
    card.innerHTML = `
      <div class="status-icon ${cls}">${icon}</div>
      <div class="status-title">${title}</div>
      <div class="status-desc">${desc}</div>
      ${metaHtml}
      ${wa ? `<a class="btn-whatsapp" href="${wa}" target="_blank" rel="noopener">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.88-.79-1.48-1.76-1.66-2.06-.17-.3-.02-.46.13-.61.14-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.68-1.62-.93-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.5 0 1.47 1.07 2.9 1.22 3.1.15.2 2.1 3.2 5.1 4.49.71.31 1.27.49 1.7.63.72.23 1.37.2 1.88.12.58-.09 1.76-.72 2-1.41.25-.7.25-1.29.18-1.41-.08-.13-.28-.2-.58-.35z"/><path d="M12.04 2C6.55 2 2.1 6.44 2.1 11.92c0 1.75.46 3.45 1.33 4.95L2 22l5.26-1.38a9.9 9.9 0 0 0 4.78 1.22c5.48 0 9.94-4.45 9.94-9.92C22 6.44 17.53 2 12.04 2zm0 18.1a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.16 8.16 0 0 1-1.26-4.32c0-4.54 3.7-8.23 8.24-8.23 4.53 0 8.22 3.69 8.22 8.23 0 4.54-3.69 8.18-8.22 8.18z"/></svg>
        كلمينا واتساب لتأكيد الاستلام</a>` : ''}
      <a class="btn btn-primary" href="index.html#shop" style="${wa ? 'margin-top:10px;' : ''}">رجوع للمتجر</a>
      ${showRetry ? '<p style="margin-top:14px;"><a href="javascript:history.back()" style="color:var(--coral-dark); font-weight:700;">حاول الدفع مرة ثانية</a></p>' : ''}
    `;
  }

  async function verify(){
    const params = new URLSearchParams(location.search);
    // Paylink may send the transaction reference under slightly different keys
    const transactionNo = params.get("transactionNo") || params.get("transactionNo".toLowerCase()) || params.get("orderNumber");

    if (!transactionNo){
      renderStatus({
        icon: "❌", cls: "fail",
        title: "تعذر العثور على رقم العملية",
        desc: "إذا تم خصم مبلغ من حسابك، تواصل معنا على واتساب وارفق لقطة شاشة من عملية الدفع.",
        showRetry: true
      });
      return;
    }

    try {
      const res = await fetch(`/api/verify-invoice?transactionNo=${encodeURIComponent(transactionNo)}`);
      const data = await res.json();

      if (data.paid){
        const waMsg = `مرحباً سولي لابز! 🎉 أكملت الدفع للتو.\nرقم العملية: ${transactionNo}\nالمبلغ: ${data.amount} ر.س\nأبغى أأكد تفاصيل الاستلام/التوصيل.`;
        const waUrl = "https://wa.me/966503416702?text=" + encodeURIComponent(waMsg);
        renderStatus({
          icon: "✅", cls: "ok",
          title: "تم تأكيد طلبك 🎉",
          desc: "شكراً لطلبك من Sulie Labs! خطوة أخيرة مهمة: كلمينا على واتساب بالزر تحت عشان نأكد معك تفاصيل الاستلام أو التوصيل.",
          meta: [
            ["رقم العملية", transactionNo],
            ["المبلغ المدفوع", toArabicDigits(data.amount) + " ر.س"]
          ],
          wa: waUrl
        });
      } else {
        renderStatus({
          icon: "❌", cls: "fail",
          title: "لم تكتمل عملية الدفع",
          desc: "حالة الطلب: " + (data.orderStatus || "غير معروفة") + ". تقدر تحاول مرة ثانية من نفس صفحة المنتج.",
          showRetry: true
        });
      }
    } catch (err){
      renderStatus({
        icon: "❌", cls: "fail",
        title: "حدث خطأ بالتحقق من الدفع",
        desc: "إذا تم خصم مبلغ من حسابك، تواصل معنا على واتساب وارفق لقطة شاشة من عملية الدفع.",
        showRetry: true
      });
      console.error(err);
    }
  }

  verify();
</script>

</body>
</html>
